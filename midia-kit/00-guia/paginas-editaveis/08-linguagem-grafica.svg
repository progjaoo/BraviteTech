<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>Bravite — 08-linguagem-grafica</title><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#FFFFFF" /><text x="80" y="58" font-family="Space Grotesk" font-size="18" font-weight="500" fill="#0A0A0A" letter-spacing="1.8">BRAVITE / GUIA DA MARCA</text><text x="1435" y="58" font-family="Space Grotesk" font-size="18" font-weight="500" fill="#0A0A0A" letter-spacing="0">08 / 12</text><path d="M80 81L1520 81" stroke="#0A0A0A" stroke-width="1" fill="none" /><text x="80" y="172" font-family="Space Grotesk" font-size="64" font-weight="500" fill="#0A0A0A" letter-spacing="0">O corte vira linguagem.</text><text x="82" y="224" font-family="Space Grotesk" font-size="24" font-weight="400" fill="#5A6475" letter-spacing="0">Diagonais da marca, alinhamento e espaço em branco formam o sistema.</text><path d="M80 925L1520 925" stroke="#0A0A0A" stroke-width="1" fill="none" /><text x="80" y="963" font-family="Space Grotesk" font-size="17" font-weight="500" fill="#0A0A0A" letter-spacing="1.2">BRAVITE.COM.BR</text><text x="1320" y="963" font-family="Space Grotesk" font-size="17" font-weight="500" fill="#0A0A0A" letter-spacing="1.2">@BRAVITE.BR</text><rect x="80" y="288" width="582" height="580" rx="0" fill="#0A0A0A" /><g opacity="1" transform="translate(186 376) scale(2.6267605633802815) translate(-60 -76)"><path d="M60 118L118 79H186L152 104H121L60 145Z M78 184L130 149H202L156 184Z" fill="#FFFFFF" /><path d="M60 155L125 112H198L158 141H126L60 184Z" fill="#2D6BFF" /></g><path d="M127 798L617 308" stroke="#2D6BFF" stroke-width="2" fill="none" stroke-dasharray="10 8" /><text x="737" y="335" font-family="Space Grotesk" font-size="25" font-weight="500" fill="#5A6475" letter-spacing="0">01</text><text x="805" y="335" font-family="Space Grotesk" font-size="33" font-weight="500" fill="#0A0A0A" letter-spacing="0">Composição</text><text x="805" y="389" font-family="Space Grotesk" font-size="27" font-weight="400" fill="#0A0A0A" letter-spacing="0">Alinhe títulos, assinatura e contatos em uma</text><text x="805" y="427.34" font-family="Space Grotesk" font-size="27" font-weight="400" fill="#0A0A0A" letter-spacing="0">mesma coluna.</text><text x="737" y="494" font-family="Space Grotesk" font-size="25" font-weight="500" fill="#5A6475" letter-spacing="0">02</text><text x="805" y="494" font-family="Space Grotesk" font-size="33" font-weight="500" fill="#0A0A0A" letter-spacing="0">Ritmo</text><text x="805" y="548" font-family="Space Grotesk" font-size="27" font-weight="400" fill="#0A0A0A" letter-spacing="0">Use intervalos de 8, 16, 24, 40 e 64 unidades</text><text x="805" y="586.34" font-family="Space Grotesk" font-size="27" font-weight="400" fill="#0A0A0A" letter-spacing="0">conforme a escala.</text><text x="737" y="653" font-family="Space Grotesk" font-size="25" font-weight="500" fill="#5A6475" letter-spacing="0">03</text><text x="805" y="653" font-family="Space Grotesk" font-size="33" font-weight="500" fill="#0A0A0A" letter-spacing="0">Destaque</text><text x="805" y="707" font-family="Space Grotesk" font-size="27" font-weight="400" fill="#0A0A0A" letter-spacing="0">Concentre o azul em um foco: título, detalhe ou</text><text x="805" y="745.34" font-family="Space Grotesk" font-size="27" font-weight="400" fill="#0A0A0A" letter-spacing="0">chamada.</text></svg>