M618 96H627V166H618Z" fill="#FFFFFF" fill-rule="evenodd" /><path d="M659 96H719V104H694V166H684V104H659Z" fill="#FFFFFF" fill-rule="evenodd" /><path d="M751 96H809V104H760V128H803V136H760V158H809V166H751Z" fill="#FFFFFF" fill-rule="evenodd" /></g><text x="1167" y="625" font-family="Space Grotesk" font-size="24" font-weight="500" fill="#0A0A0A" letter-spacing="0">Banners</text><text x="1167" y="668" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#5A6475" letter-spacing="0">Formatos por canal</text><text x="80" y="782" font-family="Space Grotesk" font-size="27" font-weight="400" fill="#0A0A0A" letter-spacing="0">Stories: mantenha textos e chamadas fora dos 250 px superiores e inferiores. Em avatar, mantenha o</text><text x="80" y="820.34" font-family="Space Grotesk" font-size="27" font-weight="400" fill="#0A0A0A" letter-spacing="0">símbolo dentro da área circular central. As interfaces dos aplicativos podem recortar bordas.</text></svg>