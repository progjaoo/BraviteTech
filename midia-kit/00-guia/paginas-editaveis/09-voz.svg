<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>Bravite — 09-voz</title><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#0A0A0A" /><text x="80" y="58" font-family="Space Grotesk" font-size="18" font-weight="500" fill="#FFFFFF" letter-spacing="1.8">BRAVITE / GUIA DA MARCA</text><text x="1435" y="58" font-family="Space Grotesk" font-size="18" font-weight="500" fill="#FFFFFF" letter-spacing="0">09 / 12</text><path d="M80 81L1520 81" stroke="#FFFFFF" stroke-width="1" fill="none" /><text x="80" y="172" font-family="Space Grotesk" font-size="64" font-weight="500" fill="#FFFFFF" letter-spacing="0">Uma voz clara, técnica e humana.</text><text x="82" y="224" font-family="Space Grotesk" font-size="24" font-weight="400" fill="#FFFFFF" letter-spacing="0">Posicionamento e textos sugeridos para a comunicação da Bravite.</text><path d="M80 925L1520 925" stroke="#FFFFFF" stroke-width="1" fill="none" /><text x="80" y="963" font-family="Space Grotesk" font-size="17" font-weight="500" fill="#FFFFFF" letter-spacing="1.2">BRAVITE.COM.BR</text><text x="1320" y="963" font-family="Space Grotesk" font-size="17" font-weight="500" fill="#FFFFFF" letter-spacing="1.2">@BRAVITE.BR</text><text x="80" y="371" font-family="Space Grotesk" font-size="82" font-weight="500" fill="#FFFFFF" letter-spacing="0">Coragem para criar.</text><text x="80" y="471" font-family="Space Grotesk" font-size="82" font-weight="500" fill="#2D6BFF" letter-spacing="0">Engenharia para evoluir.</text><path d="M80 539L1520 539" stroke="#2D6BFF" stroke-width="2" fill="none" /><text x="80" y="611" font-family="Space Grotesk" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="2">CLAREZA</text><text x="80" y="669" font-family="Space Grotesk" font-size="29" font-weight="400" fill="#FFFFFF" letter-spacing="0">Explique o objetivo, o que será</text><text x="80" y="710.18" font-family="Space Grotesk" font-size="29" font-weight="400" fill="#FFFFFF" letter-spacing="0">feito e o próximo passo.</text><text x="574" y="611" font-family="Space Grotesk" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="2">PRECISÃO</text><text x="574" y="669" font-family="Space Grotesk" font-size="29" font-weight="400" fill="#FFFFFF" letter-spacing="0">Troque promessas vagas por</text><text x="574" y="710.18" font-family="Space Grotesk" font-size="29" font-weight="400" fill="#FFFFFF" letter-spacing="0">escopo e critérios concretos.</text><text x="1068" y="611" font-family="Space Grotesk" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="2">PROXIMIDADE</text><text x="1068" y="669" font-family="Space Grotesk" font-size="29" font-weight="400" fill="#FFFFFF" letter-spacing="0">Converse de forma direta e</text><text x="1068" y="710.18" font-family="Space Grotesk" font-size="29" font-weight="400" fill="#FFFFFF" letter-spacing="0">respeitosa, sem excesso de</text><text x="1068" y="751.3599999999999" font-family="Space Grotesk" font-size="29" font-weight="400" fill="#FFFFFF" letter-spacing="0">jargão.</text><text x="80" y="843" font-family="Space Grotesk" font-size="17" font-weight="700" fill="#FFFFFF" letter-spacing="1">BIO SUGERIDA</text><text x="296" y="843" font-family="Space Grotesk" font-size="27" font-weight="400" fill="#FFFFFF" letter-spacing="0">Software house. Coragem para criar. Engenharia para evoluir.</text></svg>