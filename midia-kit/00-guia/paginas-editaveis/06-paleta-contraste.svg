<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>Bravite — paleta e contraste do rebrand</title><rect width="1600" height="1000" fill="#FFFFFF"/><text x="80" y="58" font-family="Space Grotesk" font-size="18" font-weight="500" fill="#0A0A0A">BRAVITE / GUIA DA MARCA</text><text x="1435" y="58" font-family="Space Grotesk" font-size="18" font-weight="400" fill="#0A0A0A">06 / 12</text><path d="M80 81H1520 M80 925H1520" stroke="#0A0A0A"/><text x="80" y="172" font-family="Space Grotesk" font-size="64" font-weight="500" fill="#0A0A0A">Cor com função.</text><text x="82" y="224" font-family="Space Grotesk" font-size="24" font-weight="400" fill="#5A6475">Preto dá estrutura. Azul marca a ação. Branco abre espaço.</text><rect x="80" y="286" width="339" height="300" fill="#0A0A0A" stroke="#D9DEE7"/><text x="104" y="343" font-family="Space Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">PRETO BRAVITE</text><text x="104" y="489" font-family="Space Grotesk" font-size="34" font-weight="500" fill="#FFFFFF">#0A0A0A</text><text x="104" y="541" font-family="Space Grotesk" font-size="21" font-weight="400" fill="#FFFFFF">RGB 10 / 10 / 10</text><rect x="449" y="286" width="339" height="300" fill="#2D6BFF" stroke="#D9DEE7"/><text x="473" y="343" font-family="Space Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">AZUL BRAVITE</text><text x="473" y="489" font-family="Space Grotesk" font-size="34" font-weight="500" fill="#FFFFFF">#2D6BFF</text><text x="473" y="541" font-family="Space Grotesk" font-size="21" font-weight="400" fill="#FFFFFF">RGB 45 / 107 / 255</text><rect x="818" y="286" width="339" height="300" fill="#FFFFFF" stroke="#D9DEE7"/><text x="842" y="343" font-family="Space Grotesk" font-size="18" font-weight="700" fill="#0A0A0A">BRANCO</text><text x="842" y="489" font-family="Space Grotesk" font-size="34" font-weight="500" fill="#0A0A0A">#FFFFFF</text><text x="842" y="541" font-family="Space Grotesk" font-size="21" font-weight="400" fill="#0A0A0A">RGB 255 / 255 / 255</text><rect x="1187" y="286" width="339" height="300" fill="#F3F4F6" stroke="#D9DEE7"/><text x="1211" y="343" font-family="Space Grotesk" font-size="18" font-weight="700" fill="#0A0A0A">CINZA DE APOIO</text><text x="1211" y="489" font-family="Space Grotesk" font-size="34" font-weight="500" fill="#0A0A0A">#F3F4F6</text><text x="1211" y="541" font-family="Space Grotesk" font-size="21" font-weight="400" fill="#0A0A0A">RGB 243 / 244 / 246</text><rect x="80" y="640" width="452" height="81" fill="#FFFFFF" stroke="#D9DEE7"/><text x="102" y="697" font-family="Space Grotesk" font-size="44" font-weight="500" fill="#0A0A0A">Aa</text><text x="382" y="694" font-family="Space Grotesk" font-size="30" font-weight="500" fill="#0A0A0A">19,80:1</text><text x="80" y="766" font-family="Space Grotesk" font-size="24" font-weight="400" fill="#5A6475">Preto sobre branco</text><rect x="572" y="640" width="452" height="81" fill="#2D6BFF" stroke="#D9DEE7"/><text x="594" y="697" font-family="Space Grotesk" font-size="44" font-weight="500" fill="#FFFFFF">Aa</text><text x="874" y="694" font-family="Space Grotesk" font-size="30" font-weight="500" fill="#FFFFFF">4,51:1</text><text x="572" y="766" font-family="Space Grotesk" font-size="24" font-weight="400" fill="#5A6475">Branco sobre azul</text><rect x="1064" y="640" width="452" height="81" fill="#0A0A0A" stroke="#D9DEE7"/><text x="1086" y="697" font-family="Space Grotesk" font-size="44" font-weight="500" fill="#FFFFFF">Aa</text><text x="1366" y="694" font-family="Space Grotesk" font-size="30" font-weight="500" fill="#FFFFFF">19,80:1</text><text x="1064" y="766" font-family="Space Grotesk" font-size="24" font-weight="400" fill="#5A6475">Branco sobre preto</text><text x="80" y="824" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#5A6475">Azul sobre preto: 4,39:1. Use apenas em títulos grandes ou elementos gráficos.</text><text x="80" y="870" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#5A6475">Botões: branco sobre azul sólido. Cinza #F3F4F6 é apoio; não é uma nova cor de destaque.</text><text x="80" y="963" font-family="Space Grotesk" font-size="17" font-weight="500" fill="#0A0A0A">BRAVITE.COM.BR</text><text x="1320" y="963" font-family="Space Grotesk" font-size="17" font-weight="500" fill="#0A0A0A">@BRAVITE.BR</text></svg>