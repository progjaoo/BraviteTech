<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>Bravite — 11-aplicacoes</title><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#FFFFFF" /><text x="80" y="58" font-family="Space Grotesk" font-size="18" font-weight="500" fill="#0A0A0A" letter-spacing="1.8">BRAVITE / GUIA DA MARCA</text><text x="1435" y="58" font-family="Space Grotesk" font-size="18" font-weight="500" fill="#0A0A0A" letter-spacing="0">11 / 12</text><path d="M80 81L1520 81" stroke="#0A0A0A" stroke-width="1" fill="none" /><text x="80" y="172" font-family="Space Grotesk" font-size="64" font-weight="500" fill="#0A0A0A" letter-spacing="0">Aplicar com consistência.</text><text x="82" y="224" font-family="Space Grotesk" font-size="24" font-weight="400" fill="#5A6475" letter-spacing="0">Quatro decisões simples antes de exportar uma peça.</text><path d="M80 925L1520 925" stroke="#0A0A0A" stroke-width="1" fill="none" /><text x="80" y="963" font-family="Space Grotesk" font-size="17" font-weight="500" fill="#0A0A0A" letter-spacing="1.2">BRAVITE.COM.BR</text><text x="1320" y="963" font-family="Space Grotesk" font-size="17" font-weight="500" fill="#0A0A0A" letter-spacing="1.2">@BRAVITE.BR</text><path d="M80 295L745 295" stroke="#2D6BFF" stroke-width="5" fill="none" /><text x="80" y="352" font-family="Space Grotesk" font-size="31" font-weight="500" fill="#0A0A0A" letter-spacing="0">01 / Escolha da marca</text><text x="80" y="409" font-family="Space Grotesk" font-size="29" font-weight="400" fill="#0A0A0A" letter-spacing="0">Use a assinatura completa quando houver</text><text x="80" y="450.18" font-family="Space Grotesk" font-size="29" font-weight="400" fill="#0A0A0A" letter-spacing="0">espaço. Prefira o símbolo em favicon, avatar e</text><text x="80" y="491.36" font-family="Space Grotesk" font-size="29" font-weight="400" fill="#0A0A0A" letter-spacing="0">aplicações compactas.</text><path d="M835 295L1500 295" stroke="#2D6BFF" stroke-width="5" fill="none" /><text x="835" y="352" font-family="Space Grotesk" font-size="31" font-weight="500" fill="#0A0A0A" letter-spacing="0">02 / Proporção e cores</text><text x="835" y="409" font-family="Space Grotesk" font-size="29" font-weight="400" fill="#0A0A0A" letter-spacing="0">Redimensione a marca de forma proporcional.</text><text x="835" y="450.18" font-family="Space Grotesk" font-size="29" font-weight="400" fill="#0A0A0A" letter-spacing="0">Use os arquivos principal, reverso ou</text><text x="835" y="491.36" font-family="Space Grotesk" font-size="29" font-weight="400" fill="#0A0A0A" letter-spacing="0">monocromático conforme o fundo.</text><path d="M80 550L745 550" stroke="#2D6BFF" stroke-width="5" fill="none" /><text x="80" y="607" font-family="Space Grotesk" font-size="31" font-weight="500" fill="#0A0A0A" letter-spacing="0">03 / Legibilidade</text><text x="80" y="664" font-family="Space Grotesk" font-size="29" font-weight="400" fill="#0A0A0A" letter-spacing="0">Preserve área livre ao redor da logo e</text><text x="80" y="705.18" font-family="Space Grotesk" font-size="29" font-weight="400" fill="#0A0A0A" letter-spacing="0">contraste nos textos. Mantenha contatos e</text><text x="80" y="746.3599999999999" font-family="Space Grotesk" font-size="29" font-weight="400" fill="#0A0A0A" letter-spacing="0">chamadas dentro das margens.</text><path d="M835 550L1500 550" stroke="#2D6BFF" stroke-width="5" fill="none" /><text x="835" y="607" font-family="Space Grotesk" font-size="31" font-weight="500" fill="#0A0A0A" letter-spacing="0">04 / Edição e exportação</text><text x="835" y="664" font-family="Space Grotesk" font-size="29" font-weight="400" fill="#0A0A0A" letter-spacing="0">Instale as fontes para editar SVG e PPTX.</text><text x="835" y="705.18" font-family="Space Grotesk" font-size="29" font-weight="400" fill="#0A0A0A" letter-spacing="0">Exporte PNG para redes sociais e use SVG no</text><text x="835" y="746.3599999999999" font-family="Space Grotesk" font-size="29" font-weight="400" fill="#0A0A0A" letter-spacing="0">site.</text></svg>