<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>Bravite — 02-origem</title><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#FFFFFF" /><text x="80" y="58" font-family="Space Grotesk" font-size="18" font-weight="500" fill="#0A0A0A" letter-spacing="1.8">BRAVITE / GUIA DA MARCA</text><text x="1435" y="58" font-family="Space Grotesk" font-size="18" font-weight="500" fill="#0A0A0A" letter-spacing="0">02 / 12</text><path d="M80 81L1520 81" stroke="#0A0A0A" stroke-width="1" fill="none" /><text x="80" y="172" font-family="Space Grotesk" font-size="64" font-weight="500" fill="#0A0A0A" letter-spacing="0">Um nome. Três fundamentos.</text><text x="82" y="224" font-family="Space Grotesk" font-size="24" font-weight="400" fill="#5A6475" letter-spacing="0">A origem do nome dá sentido à identidade.</text><path d="M80 925L1520 925" stroke="#0A0A0A" stroke-width="1" fill="none" /><text x="80" y="963" font-family="Space Grotesk" font-size="17" font-weight="500" fill="#0A0A0A" letter-spacing="1.2">BRAVITE.COM.BR</text><text x="1320" y="963" font-family="Space Grotesk" font-size="17" font-weight="500" fill="#0A0A0A" letter-spacing="1.2">@BRAVITE.BR</text><path d="M80 302L528 302" stroke="#2D6BFF" stroke-width="6" fill="none" /><text x="80" y="351" font-family="Space Grotesk" font-size="22" font-weight="500" fill="#5A6475" letter-spacing="0">01</text><text x="80" y="460" font-family="Space Grotesk" font-size="83" font-weight="500" fill="#0A0A0A" letter-spacing="0">BRAVE</text><text x="80" y="518" font-family="Space Grotesk" font-size="18" font-weight="700" fill="#5A6475" letter-spacing="2">CORAGEM</text><text x="80" y="578" font-family="Space Grotesk" font-size="29" font-weight="400" fill="#0A0A0A" letter-spacing="0">Iniciativa para transformar</text><text x="80" y="619.18" font-family="Space Grotesk" font-size="29" font-weight="400" fill="#0A0A0A" letter-spacing="0">uma ideia em algo concreto.</text><path d="M574 302L1022 302" stroke="#2D6BFF" stroke-width="6" fill="none" /><text x="574" y="351" font-family="Space Grotesk" font-size="22" font-weight="500" fill="#5A6475" letter-spacing="0">02</text><text x="574" y="460" font-family="Space Grotesk" font-size="83" font-weight="500" fill="#0A0A0A" letter-spacing="0">IT</text><text x="574" y="518" font-family="Space Grotesk" font-size="18" font-weight="700" fill="#5A6475" letter-spacing="2">TECNOLOGIA</text><text x="574" y="578" font-family="Space Grotesk" font-size="29" font-weight="400" fill="#0A0A0A" letter-spacing="0">Tecnologia da informação</text><text x="574" y="619.18" font-family="Space Grotesk" font-size="29" font-weight="400" fill="#0A0A0A" letter-spacing="0">como campo de atuação.</text><path d="M1068 302L1516 302" stroke="#2D6BFF" stroke-width="6" fill="none" /><text x="1068" y="351" font-family="Space Grotesk" font-size="22" font-weight="500" fill="#5A6475" letter-spacing="0">03</text><text x="1068" y="460" font-family="Space Grotesk" font-size="83" font-weight="500" fill="#0A0A0A" letter-spacing="0">E</text><text x="1068" y="518" font-family="Space Grotesk" font-size="18" font-weight="700" fill="#5A6475" letter-spacing="2">ENGINEER</text><text x="1068" y="578" font-family="Space Grotesk" font-size="29" font-weight="400" fill="#0A0A0A" letter-spacing="0">Engenharia como referência</text><text x="1068" y="619.18" font-family="Space Grotesk" font-size="29" font-weight="400" fill="#0A0A0A" letter-spacing="0">de construção e precisão.</text><text x="80" y="840" font-family="Space Grotesk" font-size="78" font-weight="500" fill="#0A0A0A" letter-spacing="0">BRAVITE</text><text x="655" y="828" font-family="Space Grotesk" font-size="40" font-weight="400" fill="#5A6475" letter-spacing="0">BRAVE + IT + E</text></svg>