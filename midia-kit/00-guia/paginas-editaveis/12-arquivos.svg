<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>Bravite — 12-arquivos</title><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#FFFFFF" /><text x="80" y="58" font-family="Space Grotesk" font-size="18" font-weight="500" fill="#0A0A0A" letter-spacing="1.8">BRAVITE / GUIA DA MARCA</text><text x="1435" y="58" font-family="Space Grotesk" font-size="18" font-weight="500" fill="#0A0A0A" letter-spacing="0">12 / 12</text><path d="M80 81L1520 81" stroke="#0A0A0A" stroke-width="1" fill="none" /><text x="80" y="172" font-family="Space Grotesk" font-size="64" font-weight="500" fill="#0A0A0A" letter-spacing="0">O kit, organizado para usar.</text><text x="82" y="224" font-family="Space Grotesk" font-size="24" font-weight="400" fill="#5A6475" letter-spacing="0">Fontes, modelos e exportações acompanham a identidade.</text><path d="M80 925L1520 925" stroke="#0A0A0A" stroke-width="1" fill="none" /><text x="80" y="963" font-family="Space Grotesk" font-size="17" font-weight="500" fill="#0A0A0A" letter-spacing="1.2">BRAVITE.COM.BR</text><text x="1320" y="963" font-family="Space Grotesk" font-size="17" font-weight="500" fill="#0A0A0A" letter-spacing="1.2">@BRAVITE.BR</text><text x="80" y="304" font-family="Space Grotesk" font-size="24" font-weight="500" fill="#0A0A0A" letter-spacing="0">00-guia</text><text x="427" y="304" font-family="Space Grotesk" font-size="24" font-weight="400" fill="#5A6475" letter-spacing="0">Manual da marca em PDF e páginas editáveis.</text><path d="M80 327L1520 327" stroke="#D9DEE7" stroke-width="2" fill="none" /><text x="80" y="369" font-family="Space Grotesk" font-size="24" font-weight="500" fill="#0A0A0A" letter-spacing="0">01-logos</text><text x="427" y="369" font-family="Space Grotesk" font-size="24" font-weight="400" fill="#5A6475" letter-spacing="0">Assinaturas e símbolos: SVG, PNG transparente e PDF.</text><path d="M80 392L1520 392" stroke="#D9DEE7" stroke-width="2" fill="none" /><text x="80" y="434" font-family="Space Grotesk" font-size="24" font-weight="500" fill="#0A0A0A" letter-spacing="0">02-social</text><text x="427" y="434" font-family="Space Grotesk" font-size="24" font-weight="400" fill="#5A6475" letter-spacing="0">Feed, stories, carrossel, destaques e banners.</text><path d="M80 457L1520 457" stroke="#D9DEE7" stroke-width="2" fill="none" /><text x="80" y="499" font-family="Space Grotesk" font-size="24" font-weight="500" fill="#0A0A0A" letter-spacing="0">03-papelaria</text><text x="427" y="499" font-family="Space Grotesk" font-size="24" font-weight="400" fill="#5A6475" letter-spacing="0">Cartões, timbrado, ficha institucional e assinatura de e-mail.</text><path d="M80 522L1520 522" stroke="#D9DEE7" stroke-width="2" fill="none" /><text x="80" y="564" font-family="Space Grotesk" font-size="24" font-weight="500" fill="#0A0A0A" letter-spacing="0">04-web</text><text x="427" y="564" font-family="Space Grotesk" font-size="24" font-weight="400" fill="#5A6475" letter-spacing="0">Favicon, ícones, cores CSS e exemplos de integração.</text><path d="M80 587L1520 587" stroke="#D9DEE7" stroke-width="2" fill="none" /><text x="80" y="629" font-family="Space Grotesk" font-size="24" font-weight="500" fill="#0A0A0A" letter-spacing="0">05-fontes</text><text x="427" y="629" font-family="Space Grotesk" font-size="24" font-weight="400" fill="#5A6475" letter-spacing="0">Space Grotesk em TTF e WOFF2, com licença OFL.</text><path d="M80 652L1520 652" stroke="#D9DEE7" stroke-width="2" fill="none" /><text x="80" y="694" font-family="Space Grotesk" font-size="24" font-weight="500" fill="#0A0A0A" letter-spacing="0">06-institucional</text><text x="427" y="694" font-family="Space Grotesk" font-size="24" font-weight="400" fill="#5A6475" letter-spacing="0">Apresentação editável, PDF, bios e legendas.</text><path d="M80 717L1520 717" stroke="#D9DEE7" stroke-width="2" fill="none" /><text x="80" y="825" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#5A6475" letter-spacing="0">Os SVGs podem ser importados no Figma. Os arquivos para impressão estão em RGB: a gráfica deve preparar a conversão para</text><text x="80" y="857.66" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#5A6475" letter-spacing="0">o papel e equipamento escolhidos. Revise os campos de modelo antes de publicar.</text></svg>